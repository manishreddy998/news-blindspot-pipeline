x-pipeline: &pipeline
  build: .
  image: news-blindspot-pipeline
  # Build on every up/run so a git pull that changes dependencies never runs an old image.
  pull_policy: build
  working_dir: /app
  environment:
    WAREHOUSE: ${WAREHOUSE:-duckdb}
    DBT_TARGET: ${DBT_TARGET:-duckdb}
    GCP_PROJECT: ${GCP_PROJECT:-}
    BQ_DATASET: ${BQ_DATASET:-raw_gdelt}
    SUMMARY_MODE: ${SUMMARY_MODE:-extractive}
    SCHEDULE_ON: ${SCHEDULE_ON:-1}
    GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp.json
    DUCKDB_PATH: /app/data/blindspot.duckdb
    DAGSTER_HOME: /app/data/dagster
    DBT_PROJECT_DIR: /app/dbt
  volumes:
    - ./data:/app/data
    - ./src:/app/src
    - ./tests:/app/tests
    - ./dbt:/app/dbt
    - ./dashboard:/app/dashboard
    # Point GCP_KEY_PATH at your key on the host. It is mounted read only and never copied into the image.
    - ${GCP_KEY_PATH:-./docker/no-gcp-key}:/secrets/gcp.json:ro

services:
  pipeline:
    <<: *pipeline

  dagster:
    <<: *pipeline
    command: sh -c "mkdir -p $${DAGSTER_HOME:-/app/data/dagster} && dagster dev -h 0.0.0.0 -p 3000 -m blindspot.orchestration.definitions"
    ports:
      - "3000:3000"

  dashboard:
    <<: *pipeline
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    ports:
      - "8501:8501"
