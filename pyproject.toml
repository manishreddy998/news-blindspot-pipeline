[project]
name = "news-blindspot-pipeline"
version = "0.1.0"
description = "Coverage split and blindspot scoring over GDELT news data"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.20"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
