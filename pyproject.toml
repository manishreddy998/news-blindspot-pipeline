[project]
name = "news-blindspot-pipeline"
version = "0.1.0"
description = "Coverage split and blindspot scoring over GDELT news data"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.20"]
dbt = ["dbt-core>=1.11,<1.12", "dbt-duckdb>=1.9", "dbt-bigquery>=1.10"]
orchestration = ["dagster>=1.8", "dagster-webserver>=1.8"]
dashboard = ["streamlit>=1.38", "pandas>=2.2"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
