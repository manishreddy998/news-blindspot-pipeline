name: blindspot
version: "0.1.0"
config-version: 2
profile: blindspot

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # A story needs at least this many articles from rated outlets before we score it.
  min_rated_articles: 5
  # Flag a blindspot when one side has this share of the left plus right coverage.
  blindspot_threshold: 0.8
  # Audience score cut offs for the lean buckets. Scores between them count as center.
  lean_left_max: -0.2
  lean_right_min: 0.2

models:
  blindspot:
    staging:
      +materialized: table
    stories:
      +materialized: table

