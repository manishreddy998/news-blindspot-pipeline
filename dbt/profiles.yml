blindspot:
  target: "{{ env_var('DBT_TARGET', 'duckdb') }}"
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../data/blindspot.duckdb') }}"
      threads: 4
    bigquery:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT', 'groundnews-prototype') }}"
      dataset: analytics
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS', '/secrets/gcp.json') }}"
      location: US
      threads: 4
      job_execution_timeout_seconds: 300
